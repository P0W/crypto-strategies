name: Strategy Regression Tests

on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'configs/**'
      - '.github/workflows/regression-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'configs/**'
      - '.github/workflows/regression-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  regression-tests:
    name: 🧪 Strategy Regression Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: 📦 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🔨 Build release binary
        run: cargo build --release

      - name: 🧪 Run strategy regression tests
        id: regression
        run: |
          STRATEGIES="regime_grid quick_flip momentum_scalper range_breakout volatility_regime"
          FAILED=""
          BETTER=""
          
          echo "## 📊 Strategy Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for strategy in $STRATEGIES; do
            CONFIG="configs/${strategy}_config.json"
            echo "### 🎯 ${strategy}" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
            
            set +e
            timeout 600 ./target/release/crypto-strategies optimize --config "$CONFIG" --top 1 > "/tmp/${strategy}_stdout.txt" 2> "/tmp/${strategy}_stderr.txt"
            EXIT_CODE=$?
            set -e
            
            echo "⏱️ Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC') | Exit: $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
            
            # Show stderr if present
            if [ -s "/tmp/${strategy}_stderr.txt" ]; then
              echo "<details><summary>⚠️ Stderr</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat "/tmp/${strategy}_stderr.txt" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Show last 30 lines of output
            echo "<details><summary>📋 Output (last 30 lines)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 "/tmp/${strategy}_stdout.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            
            # Determine status
            if [ $EXIT_CODE -eq 124 ]; then
              echo "❌ **TIMEOUT** (>10min)" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            elif [ $EXIT_CODE -ne 0 ]; then
              echo "❌ **CRASHED** (exit $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            elif grep -q "is already optimal" "/tmp/${strategy}_stdout.txt"; then
              echo "✅ **PASSED** - config is already optimal" >> $GITHUB_STEP_SUMMARY
            elif grep -q "Config updated:" "/tmp/${strategy}_stdout.txt"; then
              echo "🔄 **BETTER CONFIG FOUND**" >> $GITHUB_STEP_SUMMARY
              BETTER="$BETTER $strategy"
            elif grep -q "No valid runs found" "/tmp/${strategy}_stdout.txt"; then
              echo "❌ **NO VALID RUNS**" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            elif grep -q "Won't save a losing strategy" "/tmp/${strategy}_stdout.txt"; then
              echo "❌ **NEGATIVE METRIC** - losing strategy" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            else
              echo "❌ **UNEXPECTED OUTPUT**" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
          done
          
          # Summary table
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for strategy in $STRATEGIES; do
            if echo "$FAILED" | grep -qw "$strategy"; then
              echo "| $strategy | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            elif echo "$BETTER" | grep -qw "$strategy"; then
              echo "| $strategy | 🔄 Better config |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $strategy | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Performance metrics table from _optimization
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📈 Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | Return | Sharpe | Max DD | Win Rate | Trades |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|--------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for strategy in $STRATEGIES; do
            config="configs/${strategy}_config.json"
            if jq -e '.grid._optimization[0]' "$config" > /dev/null 2>&1; then
              opt=$(jq '.grid._optimization[0]' "$config")
              ret=$(echo "$opt" | jq -r '.total_return')
              sharpe=$(echo "$opt" | jq -r '.sharpe_ratio')
              maxdd=$(echo "$opt" | jq -r '.max_drawdown')
              winrate=$(echo "$opt" | jq -r '.win_rate')
              trades=$(echo "$opt" | jq -r '.total_trades')
              echo "| ${strategy} | ${ret}% | ${sharpe} | ${maxdd}% | ${winrate}% | ${trades} |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          # Set outputs
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "better=$BETTER" >> $GITHUB_OUTPUT

      - name: 📊 Update README performance table
        if: github.event_name == 'push'
        run: |
          # Generate performance table from config _optimization sections
          # Sort by total_return descending
          TABLE=$(cat << 'HEADER'
          | Strategy | Symbols | Return | Sharpe | Max DD | Win Rate | Trades | Expectancy |
          |----------|---------|--------|--------|--------|----------|--------|------------|
          HEADER
          )

          # Extract metrics from each config and sort by return
          for config in configs/*_config.json; do
            strategy=$(basename "$config" _config.json)

            # Check if _optimization exists and has data
            if jq -e '.grid._optimization[0]' "$config" > /dev/null 2>&1; then
              opt=$(jq '.grid._optimization[0]' "$config")
              symbols=$(echo "$opt" | jq -r '.symbols | map(gsub("INR$";"")) | join(",")')
              ret=$(echo "$opt" | jq -r '.total_return')
              sharpe=$(echo "$opt" | jq -r '.sharpe_ratio')
              maxdd=$(echo "$opt" | jq -r '.max_drawdown')
              winrate=$(echo "$opt" | jq -r '.win_rate')
              trades=$(echo "$opt" | jq -r '.total_trades')
              expect=$(echo "$opt" | jq -r '.expectancy | floor')

              echo "${ret}|**${strategy}**|${symbols}|${ret}%|${sharpe}|${maxdd}%|${winrate}%|${trades}|₹${expect}" >> /tmp/perf_rows.txt
            fi
          done

          # Sort by return (first field) descending and format
          if [ -f /tmp/perf_rows.txt ]; then
            ROWS=$(sort -t'|' -k1 -nr /tmp/perf_rows.txt | cut -d'|' -f2- | sed 's/^/| /;s/$/|/')
            TABLE="${TABLE}
          ${ROWS}"
          fi

          # Replace section in README between markers
          awk '
            /<!-- PERF_TABLE_START -->/ { print; skip=1; next }
            /<!-- PERF_TABLE_END -->/ { skip=0 }
            !skip { print }
          ' README.md > /tmp/readme_stripped.md

          awk -v table="$TABLE" '
            /<!-- PERF_TABLE_START -->/ { print; print table; next }
            { print }
          ' /tmp/readme_stripped.md > README.md

          echo "README.md updated with latest performance metrics"

      - name: 📝 Commit updated configs and README
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage any changed configs
          BETTER="${{ steps.regression.outputs.better }}"
          for strategy in $BETTER; do
            git add "configs/${strategy}_config.json"
          done

          # Stage README if changed
          git add README.md

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COMMIT_MSG="chore: auto-update optimization results"
            if [ -n "$BETTER" ]; then
              COMMIT_MSG="chore: auto-update configs and performance metrics

          Updated strategies:$BETTER"
            fi

            git commit -m "$COMMIT_MSG

          Triggered by: ${{ github.sha }}"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚠️ Better configs found (PR)
        if: steps.regression.outputs.better != '' && github.event_name == 'pull_request'
        run: |
          echo "::warning::Better configs found for:${{ steps.regression.outputs.better }}. Merge this PR and run workflow again to auto-update."

      - name: ❌ Fail if any regression test failed
        if: steps.regression.outputs.failed != ''
        run: |
          echo "::error::Regression tests failed for:${{ steps.regression.outputs.failed }}"
          exit 1

  lint-and-test:
    name: 🔍 Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: 📦 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 📝 Check formatting
        run: cargo fmt --all -- --check

      - name: 🔎 Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🧪 Run all tests
        run: cargo test --all-targets --verbose
