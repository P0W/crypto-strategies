name: Strategy Regression Tests

on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'configs/**'
      - '.github/workflows/regression-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'configs/**'
      - '.github/workflows/regression-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  regression-tests:
    name: 🧪 Strategy Regression Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: 📦 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🔨 Build release binary
        run: cargo build --release

      - name: 🧪 Run strategy regression tests
        id: regression
        run: |
          STRATEGIES="regime_grid quick_flip momentum_scalper range_breakout volatility_regime"
          FAILED=""
          
          echo "## 📊 Strategy Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for strategy in $STRATEGIES; do
            CONFIG="configs/${strategy}_config.json"
            echo "### 🎯 ${strategy}" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
            
            set +e
            timeout 600 ./target/release/crypto-strategies optimize --config "$CONFIG" --top 1 --min-trades 1 --no-update > "/tmp/${strategy}_stdout.txt" 2> "/tmp/${strategy}_stderr.txt"
            EXIT_CODE=$?
            set -e
            
            echo "⏱️ Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC') | Exit: $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
            
            # Show stderr if present
            if [ -s "/tmp/${strategy}_stderr.txt" ]; then
              echo "<details><summary>⚠️ Stderr</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat "/tmp/${strategy}_stderr.txt" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Show last 30 lines of output
            echo "<details><summary>📋 Output (last 30 lines)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 "/tmp/${strategy}_stdout.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            
            # Determine status
            if [ $EXIT_CODE -eq 124 ]; then
              echo "❌ **TIMEOUT** (>10min)" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            elif [ $EXIT_CODE -ne 0 ]; then
              echo "❌ **CRASHED** (exit $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            elif grep -q "No valid runs found" "/tmp/${strategy}_stdout.txt"; then
              echo "❌ **NO VALID RUNS**" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            elif grep -q "OPTIMIZATION COMPLETE" "/tmp/${strategy}_stdout.txt"; then
              echo "✅ **PASSED** - optimizer completed with valid runs" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **UNEXPECTED OUTPUT**" >> $GITHUB_STEP_SUMMARY
              FAILED="$FAILED $strategy"
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
          done
          
          # Summary table
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for strategy in $STRATEGIES; do
            if echo "$FAILED" | grep -qw "$strategy"; then
              echo "| $strategy | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $strategy | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Set outputs
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: ❌ Fail if any regression test failed
        if: steps.regression.outputs.failed != ''
        run: |
          echo "::error::Regression tests failed for:${{ steps.regression.outputs.failed }}"
          exit 1

  lint-and-test:
    name: 🔍 Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: 📦 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 📝 Check formatting
        run: cargo fmt --all -- --check

      - name: 🔎 Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🧪 Run all tests
        run: cargo test --all-targets --verbose
